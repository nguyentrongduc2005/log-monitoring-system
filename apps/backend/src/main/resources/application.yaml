spring:
  application:
    name: log-monitoring

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      open-in-view: false
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

  kafka:
    listener:
      ack-mode: manual_immediate
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_LOG_PROCESSING:log-processing-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vdt.log_monitoring.*
        spring.json.value.default.type: com.vdt.log_monitoring.modules.ingestion.api.events.RawLogReceivedEvent
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 3000
        request.timeout.ms: 3000

server:
  port: ${SERVER_PORT:8080}

# management:
#   endpoints:
#     web:
#       exposure:
#         include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  security:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:10}
    api-key:
      key-prefix: ${API_KEY_PREFIX:lms_live_}
      prefix-characters: ${API_KEY_PREFIX_CHARACTERS:abcdefghijklmnopqrstuvwxyz0123456789}
      random-prefix-length: ${API_KEY_RANDOM_PREFIX_LENGTH:10}
      secret-length-bytes: ${API_KEY_SECRET_LENGTH_BYTES:32}
      verification-cache:
        prefix: ${API_KEY_CACHE_PREFIX:identity:api_key:verification:}
        index-prefix: ${API_KEY_CACHE_INDEX_PREFIX:identity:api_key:verification_index:}
        ttl-seconds: ${API_KEY_CACHE_TTL_SECONDS:300}
    jwt:
      secret: ${JWT_SECRET:default-secret-key-that-must-be-very-long-and-secure-for-hmac-sha-256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
      access-token:
        blacklist-prefix: ${JWT_ACCESS_TOKEN_BLACKLIST_PREFIX:identity:access_token:blacklist:}
      refresh-token:
        prefix: ${JWT_REFRESH_TOKEN_PREFIX:identity:refresh_token:}
        user-prefix: ${JWT_USER_REFRESH_TOKEN_PREFIX:identity:user_refresh_token:}
        expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  kafka:
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
    consumer-groups:
      realtime: ${KAFKA_CONSUMER_GROUP_REALTIME:realtime-live-log-group}
      alerts-critical: ${KAFKA_CONSUMER_GROUP_ALERTS_CRITICAL:alerts-critical-group}
      anomaly-signals: ${KAFKA_CONSUMER_GROUP_ANOMALY_SIGNALS:anomaly-signals-group}
      anomaly-detected-alerting: ${KAFKA_CONSUMER_GROUP_ANOMALY_DETECTED_ALERTING:alerting-anomaly-detected-group}
      anomaly-ai-incident: ${KAFKA_CONSUMER_GROUP_ANOMALY_AI_INCIDENT:incident-anomaly-ai-group}
    retry:
      auto-create-topics: ${KAFKA_RETRY_AUTO_CREATE_TOPICS:false}
      dlt-topic-suffix: ${KAFKA_RETRY_DLT_TOPIC_SUFFIX:.DLT}
      raw-processing-attempts: ${KAFKA_RAW_PROCESSING_RETRY_ATTEMPTS:3}
      raw-processing-backoff-ms: ${KAFKA_RAW_PROCESSING_RETRY_BACKOFF_MS:1000}
      realtime-delivery-attempts: ${KAFKA_REALTIME_DELIVERY_RETRY_ATTEMPTS:3}
      realtime-delivery-backoff-ms: ${KAFKA_REALTIME_DELIVERY_RETRY_BACKOFF_MS:1000}
      alerts-critical-delivery-attempts: ${KAFKA_ALERTS_CRITICAL_DELIVERY_RETRY_ATTEMPTS:3}
      alerts-critical-delivery-backoff-ms: ${KAFKA_ALERTS_CRITICAL_DELIVERY_RETRY_BACKOFF_MS:1000}
    topics:
      raw: ${KAFKA_TOPIC_LOGS_RAW:logs.raw}
      raw-dlt: ${KAFKA_TOPIC_LOGS_RAW_DLT:logs.raw.DLT}
      live: ${KAFKA_TOPIC_LOGS_LIVE:logs.live}
      live-dlt: ${KAFKA_TOPIC_LOGS_LIVE_DLT:logs.live.DLT}
      alerts-critical: ${KAFKA_TOPIC_ALERTS_CRITICAL:alerts.critical}
      alerts-critical-dlt: ${KAFKA_TOPIC_ALERTS_CRITICAL_DLT:alerts.critical.DLT}
      processing-errors: ${KAFKA_TOPIC_PROCESSING_ERRORS:processing.errors}
      anomaly-signals: ${KAFKA_TOPIC_ANOMALY_SIGNALS:logs.anomaly.signals}
      anomaly-signals-dlt: ${KAFKA_TOPIC_ANOMALY_SIGNALS_DLT:logs.anomaly.signals.DLT}
      anomaly-detected: ${KAFKA_TOPIC_ANOMALY_DETECTED:anomaly.detected}
      anomaly-detected-dlt: ${KAFKA_TOPIC_ANOMALY_DETECTED_DLT:anomaly.detected.DLT}
      anomaly-ai-requested: ${KAFKA_TOPIC_ANOMALY_AI_REQUESTED:anomaly.ai.requested}
      anomaly-report-updated: ${KAFKA_TOPIC_ANOMALY_REPORT_UPDATED:anomaly.report.updated}
  logs:
    idempotency:
      key-prefix: ${LOG_INGESTION_IDEMPOTENCY_KEY_PREFIX:logs:ingestion:idempotency}
      ttl: ${LOG_INGESTION_IDEMPOTENCY_TTL:24h}
  anomaly:
    index-ttl: ${ANOMALY_INDEX_TTL:15m}
    metric:
      scrape-interval: ${ANOMALY_METRIC_SCRAPE_INTERVAL:10s}
      freshness-ttl: ${ANOMALY_METRIC_FRESHNESS_TTL:60s}
      default-application-id: ${ANOMALY_METRIC_DEFAULT_APPLICATION_ID:}
    collector:
      enabled: ${ANOMALY_COLLECTOR_ENABLED:true}
      interval: ${ANOMALY_COLLECTOR_INTERVAL:30s}
    scoring:
      metric-confidence-samples: ${ANOMALY_SCORING_METRIC_CONFIDENCE_SAMPLES:3}
      top-evidence-limit: ${ANOMALY_SCORING_TOP_EVIDENCE_LIMIT:5}
      thresholds:
        warning: ${ANOMALY_SCORING_WARNING_THRESHOLD:40}
        anomaly: ${ANOMALY_SCORING_ANOMALY_THRESHOLD:70}
        critical: ${ANOMALY_SCORING_CRITICAL_THRESHOLD:85}
      weights:
        "log.RESOURCE_EXHAUSTED": ${ANOMALY_WEIGHT_LOG_RESOURCE_EXHAUSTED:0.12}
        "log.SECURITY_AUTH_FAILURE": ${ANOMALY_WEIGHT_LOG_SECURITY_AUTH_FAILURE:0.18}
        "log.ACCESS_DENIED": ${ANOMALY_WEIGHT_LOG_ACCESS_DENIED:0.10}
        "log.TIMEOUT": ${ANOMALY_WEIGHT_LOG_TIMEOUT:0.10}
        "log.EXCEPTION": ${ANOMALY_WEIGHT_LOG_EXCEPTION:0.10}
        "log.CRITICAL_LEVEL": ${ANOMALY_WEIGHT_LOG_CRITICAL_LEVEL:0.12}
        "log.ERROR_LEVEL": ${ANOMALY_WEIGHT_LOG_ERROR_LEVEL:0.10}
        "log.SUSPICIOUS_KEYWORD": ${ANOMALY_WEIGHT_LOG_SUSPICIOUS_KEYWORD:0.08}
        "metric.CPU_USAGE": ${ANOMALY_WEIGHT_METRIC_CPU_USAGE:0.08}
        "metric.MEMORY_USAGE": ${ANOMALY_WEIGHT_METRIC_MEMORY_USAGE:0.07}
        "metric.DISK_USAGE": ${ANOMALY_WEIGHT_METRIC_DISK_USAGE:0.04}
        "metric.DISK_WRITE_RATE": ${ANOMALY_WEIGHT_METRIC_DISK_WRITE_RATE:0.00}
        "metric.NETWORK_RX_RATE": ${ANOMALY_WEIGHT_METRIC_NETWORK_RX_RATE:0.00}
        "metric.NETWORK_TX_RATE": ${ANOMALY_WEIGHT_METRIC_NETWORK_TX_RATE:0.00}
  alerting:
    rule-cache:
      key-prefix: ${ALERT_RULE_CACHE_KEY_PREFIX:alerting:rules:active:}
      ttl: ${ALERT_RULE_CACHE_TTL:5m}
    threshold-cache:
      key-prefix: ${ALERT_THRESHOLD_CACHE_KEY_PREFIX:alerting:evaluation:}
      idempotency-ttl-seconds: ${ALERT_IDEMPOTENCY_TTL_SECONDS:86400}
    telegram:
      api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
  incident:
    ai:
      provider: ${INCIDENT_AI_PROVIDER:gemini}
      api-base-url: ${INCIDENT_AI_API_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${INCIDENT_AI_API_KEY:}
      model: ${INCIDENT_AI_MODEL:gemini-3.1-flash-lite}
      timeout: ${INCIDENT_AI_TIMEOUT:30s}
